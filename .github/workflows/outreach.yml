name: Daily Outreach

on:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail token
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: echo "$GMAIL_TOKEN_B64" | base64 --decode > token.json

      - name: Run outreach (professional + PhD)
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          HUNTER_API_KEY:     ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY:     ${{ secrets.APOLLO_API_KEY }}
          RESUME_PDF_PATH:    resume/Francis_Konikkara_Resume.pdf
          EMAILS_PER_RUN:     "10"
          PHD_EMAILS_PER_RUN: "10"
        run: python main.py --run-now

      - name: Commit updated trackers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outreach_tracker.json sent_companies.json contacts_found.json target_companies.json phd_tracker.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update outreach trackers [skip ci]"
          git push
        continue-on-error: true

      - name: Upload outreach log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-log-${{ github.run_number }}
          path: outreach.log
          retention-days: 30
